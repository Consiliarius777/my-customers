<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Customers">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>My Customers</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#86868c;--line:#e3e3e8;--fill:#ececf1;
  --danger:#d33a46;--ok:#23915c;--warn:#b5730a;--accent:#c93d6e;--accent-ink:#fff;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --soft:color-mix(in srgb,var(--accent) 13%,transparent);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#9a9aa1;--line:#323236;--fill:#2b2b2f;--danger:#ff5f68;--ok:#3ccf86;--warn:#f0a83a;--shadow:none;--soft:color-mix(in srgb,var(--accent) 24%,transparent);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#9a9aa1;--line:#323236;--fill:#2b2b2f;--danger:#ff5f68;--ok:#3ccf86;--warn:#f0a83a;--shadow:none;--soft:color-mix(in srgb,var(--accent) 24%,transparent);color-scheme:dark}

html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;gap:10px;max-width:672px;margin:0 auto}
header.top h1{font-size:28px;font-weight:700;margin:0;flex:1;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top h1 button{font-weight:700;display:inline-flex;align-items:center;gap:4px}
header.top h1 button svg{width:18px;height:18px;color:var(--accent);transition:transform .2s}
header.top h1 button.open svg{transform:rotate(180deg)}
.hbtn{color:var(--accent);font-size:16px;padding:6px 4px;font-weight:500}
.hbtn.round{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;padding:0}
.hbtn svg{width:20px;height:20px}
main{padding:0 16px 24px;max-width:672px;margin:0 auto}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;max-width:130px;color:var(--muted);padding:7px 0 5px;font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:25px;height:25px}

.card{background:var(--card);border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sec-title{margin:22px 4px 6px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.sec-title button{color:var(--accent);text-transform:none;letter-spacing:0;font-size:15px;font-weight:500}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

/* week strip */
.week{display:flex;align-items:center;gap:2px;margin:4px -8px 0}
.week .nav{width:26px;height:44px;color:var(--muted);display:grid;place-items:center;flex:none}
.week .nav svg{width:16px;height:16px}
.days{flex:1;min-width:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 calc(100% / 7);scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;padding:6px 0 7px;border-radius:12px;gap:3px;min-width:0}
.day.mstart .dw{color:var(--accent)}
.day .dw{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600}
.day .dn{font-size:18px;font-weight:600;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.day .dots{height:6px;display:flex;gap:2px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.today .dn{color:var(--accent)}
.day.sel .dn{background:var(--accent);color:var(--accent-ink)}
.day.off .dn{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.day.sel.off .dn{color:var(--accent-ink)}

/* month grid */
.month{background:var(--card);border-radius:14px;padding:8px 6px 10px;margin:8px 0 4px;box-shadow:var(--shadow)}
.month .mh{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 6px}
.month .mh b{font-size:16px}
.month .mh button{color:var(--accent);width:36px;height:32px;display:grid;place-items:center}
.month .mh svg{width:18px;height:18px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mgrid .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600;text-transform:uppercase;padding:2px 0 4px}
.mc{min-height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:4px 1px 3px;gap:2px;overflow:hidden}
.mc .n{font-size:15px;font-weight:500;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.mc .c{font-size:10px;line-height:1.15;color:var(--muted);text-align:center;width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mc .c.has{color:var(--accent);font-weight:600}
.mc.other{opacity:.35}
.mc.today .n{color:var(--accent);font-weight:700}
.mc.sel .n{background:var(--accent);color:var(--accent-ink)}
.mc.off{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--fill) 5px 7px)}

.daybar{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 6px;gap:8px}
.daybar .dt{font-size:20px;font-weight:700;letter-spacing:-.01em}
.daybar .sub{font-size:14px;color:var(--muted);margin-top:1px}
.pill{font-size:14px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--fill);color:var(--text);white-space:nowrap}
.pill.on{background:var(--soft);color:var(--accent)}

.offnote{background:var(--fill);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:14px;margin:8px 0}

.list{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin:8px 0}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;position:relative;min-height:52px}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .end{text-align:right;flex:none}
.row .end .t2{text-align:right}
.row .chev{width:14px;height:14px;color:var(--muted);flex:none}
.row.danger{color:var(--danger)}
.row.accent{color:var(--accent);font-weight:500}

.appt .tm{width:50px;flex:none;font-variant-numeric:tabular-nums}
.appt .tm b{display:block;font-size:16px}
.appt .tm span{font-size:13px;color:var(--muted)}
.appt .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--accent);flex:none}
.appt.past .bar{background:var(--muted);opacity:.5}
.appt.cx .t1,.appt.cx .price{text-decoration:line-through;color:var(--muted)}
.appt.cx .bar{background:var(--danger);opacity:.6}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--fill);color:var(--muted);vertical-align:1px;margin-left:4px}
.badge.red{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.badge.green{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.price{font-weight:600;font-variant-numeric:tabular-nums}

.fab{position:fixed;right:max(18px,calc(50% - 318px));bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);z-index:15}
.fab svg{width:28px;height:28px}

.banner{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:14px}
.banner .grow{flex:1}
.banner b{display:block;font-size:15px;margin-bottom:2px}
.banner .acts{display:flex;gap:14px;margin-top:6px}
.banner .acts button{color:var(--accent);font-weight:600;font-size:14px}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:11px;padding:0 10px;margin:4px 0 8px}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:0;flex:1;padding:9px 0;min-width:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}

/* stats */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:4px 0 8px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.pnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0}
.pnav b{font-size:17px}
.pnav button{width:40px;height:36px;display:grid;place-items:center;color:var(--accent)}
.pnav button:disabled{opacity:.3}
.pnav svg{width:18px;height:18px}
.hero{font-size:36px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.tile .l{font-size:13px;color:var(--muted)}
.tile .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v.pos{color:var(--ok)} .tile .v.neg{color:var(--danger)}
.kv{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}
.kv span:last-child{font-variant-numeric:tabular-nums;font-weight:500}
.delta{font-size:14px;font-weight:600}
.delta.up{color:var(--ok)} .delta.down{color:var(--danger)}
.progress{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hbars .hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 0}
.hbars .hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.hbars .hb .vl{font-size:14px;font-variant-numeric:tabular-nums;font-weight:500}
.hbars .hb .tr{grid-column:1/-1;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.hbars .hb .tr i{display:block;height:100%;background:var(--accent);border-radius:3px}
.hbars .hb .sub{grid-column:1/-1;font-size:12px;color:var(--muted)}
.chart{position:relative;margin-top:6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--text);color:var(--bg);font-size:12px;font-weight:600;padding:4px 8px;border-radius:7px;white-space:nowrap;pointer-events:none}
.chart .bar{fill:var(--accent);opacity:.45}
.chart .bar.cur{opacity:1}
.chart .bar.hl{opacity:.85}
.chart .hit{fill:transparent;cursor:pointer}
.chart .axis{font-size:10px;fill:var(--muted);font-family:inherit}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:16px 16px 0 0;max-height:calc(100% - env(safe-area-inset-top) - 18px);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:672px;margin:0 auto}
.sheet.show{transform:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;gap:8px;border-bottom:.5px solid var(--line)}
.sheet .sh b{font-size:17px;font-weight:600;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .sh button{color:var(--accent);font-size:17px;min-width:72px;text-align:left}
.sheet .sh button.r{text-align:right;font-weight:600}
.sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}

.form{background:var(--card);border-radius:14px;margin:12px 0;overflow:hidden}
.field{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:48px;position:relative}
.field+.field::before,.field+.chipsbox::before,.chipsbox+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.field label{flex:none;width:118px;color:var(--text);font-size:16px}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;outline:0;padding:12px 0;text-align:right}
.field input[type=date],.field input[type=time]{text-align:right;-webkit-appearance:none;appearance:none;min-height:24px}
.field select{-webkit-appearance:none;appearance:none;direction:rtl;color:var(--text)}
.field textarea{text-align:left;resize:none;min-height:70px}
.field.col{flex-direction:column;align-items:stretch;gap:0}
.field.col label{width:auto;padding-top:12px;color:var(--muted);font-size:13px}
.field.col input,.field.col textarea{text-align:left}
.field .unit{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:-4px 16px 12px;line-height:1.35}
.chipsbox{padding:6px 16px 10px;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:500;max-width:100%}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.sel{background:var(--accent);color:var(--accent-ink)}
.chip.sug{background:var(--soft);color:var(--accent)}
.chip small{opacity:.75;font-weight:400}
.chip .x{font-size:16px;line-height:1;opacity:.8;margin-right:-2px}
.sugs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 0;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sugs .chip{flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:13px;background:var(--card);color:var(--accent);font-weight:600;font-size:16px;margin:10px 0}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn svg{width:19px;height:19px}
.btnrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin:10px 0}
.btnrow .btn{margin:0;flex-direction:column;gap:3px;font-size:12px;padding:10px 4px;font-weight:500}
.btnrow .btn svg{width:22px;height:22px}
.status{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px}
.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{opacity:0;position:absolute;inset:0;margin:0;z-index:1}
.toggle i{position:absolute;inset:0;border-radius:16px;background:var(--fill);transition:.2s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.toggle input:checked+i{background:var(--ok)}
.toggle input:checked+i::after{transform:translateX(20px)}
.swatches{display:flex;gap:12px;padding:12px 16px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;outline:2px solid transparent}
.sw.on{outline-color:var(--text);border-color:var(--card)}
.warnbox{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--text);border-radius:12px;padding:10px 14px;font-size:14px;margin:10px 0}

.dlg-wrap{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:24px;opacity:0;transition:opacity .15s}
.dlg-wrap.show{opacity:1}
.dlg{background:var(--card);border-radius:16px;width:100%;max-width:300px;overflow:hidden;text-align:center}
.dlg p{margin:0;padding:20px 18px 16px;font-size:15px;line-height:1.4}
.dlg-b{display:flex;border-top:.5px solid var(--line)}
.dlg-b button{flex:1;padding:13px 8px;color:var(--accent);font-size:17px}
.dlg-b button+button{border-left:.5px solid var(--line)}
.dlg-b button.strong{font-weight:600}
.dlg-b button.danger{color:var(--danger);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:100;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:700px){.sheet{border-radius:16px;bottom:24px;max-height:calc(100% - 48px)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheets"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script>
'use strict';
/* =========================================================================
   My Customers — offline client book for a solo specialist.
   All data lives on this device (IndexedDB). Nothing is sent anywhere.
   ========================================================================= */

const APP_VERSION = '1.1.0';
const DB_NAME = 'my-customers', STORE = 'kv', KEY = 'state';

/* ---------- icons ---------- */
const I = {
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M7.5 13.5h2M11 13.5h2M14.5 13.5h2M7.5 17h2M11 17h2"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></svg>',

function defaults(){
  return {
    v:1, clients:[], services:[], appts:[], expenses:[], incomes:[], daysOff:[],

      lang:(navigator.language||'ru').toLowerCase().startsWith('ru')||(navigator.language||'').toLowerCase().startsWith('uk')?'ru':'en',

      lastBackup:null, welcomed:false

function normalize(s){
  const d = defaults();
  if(!s || typeof s!=='object') return d;
  const arr = k => Array.isArray(s[k]) ? s[k] : [];
  return {v:1, clients:arr('clients'), services:arr('services'), appts:arr('appts'), expenses:arr('expenses'), incomes:arr('incomes'), daysOff:arr('daysOff'),
          settings:Object.assign(d.settings, s.settings||{})};
}

/* ---------- storage (IndexedDB, falls back to localStorage) ---------- */
let dbp = null;
function idb(){
  if(!dbp) dbp = new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME,1);
    r.onupgradeneeded = ()=>r.result.createObjectStore(STORE);
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
  return dbp;
}
async function loadState(){
  try{
    const db = await idb();
    const v = await new Promise((res,rej)=>{const q=db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
    if(v) return v;
  }catch(e){ console.warn('IDB load failed',e); }
  try{ const s = localStorage.getItem(DB_NAME); if(s) return JSON.parse(s); }catch(e){}
  return null;
}
async function writeState(){
  const snapshot = JSON.parse(JSON.stringify(state));
  try{
    const db = await idb();
    await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(snapshot,KEY);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});
  }catch(e){
    console.warn('IDB save failed, using localStorage',e);
    try{ localStorage.setItem(DB_NAME, JSON.stringify(snapshot)); }catch(e2){ toast('⚠️ Save failed'); }
  }
}
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{saveTimer=null;writeState();},120); }
function flush(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; writeState(); } }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flush(); });
window.addEventListener('pagehide',flush);

const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad = n=>String(n).padStart(2,'0');
const dstr = d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pdate = s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const today = ()=>dstr(new Date());
const addDays = (s,n)=>{const d=pdate(s);d.setDate(d.getDate()+n);return dstr(d);};
const addMonths = (s,n)=>{const d=pdate(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return dstr(d);};
const monthStart = s=>s.slice(0,8)+'01';
const monthEnd = s=>{const d=pdate(s);return dstr(new Date(d.getFullYear(),d.getMonth()+1,0));};
const weekStart = s=>{const d=pdate(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dstr(d);};
const toMin = t=>{if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+(m||0);};
const fromMin = m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);};
const num = v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?Math.round(n*100)/100:0;};
const normName = s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
const cleanName = s=>String(s||'').trim().replace(/\s+/g,' ');
const L = ()=>state.settings.lang==='en'?'en-US':'ru-RU';
function t(k,vars){ let s=(T[state.settings.lang]||T.ru)[k]; if(s==null) s=T.ru[k]??k; if(vars) for(const v in vars) s=s.split('{'+v+'}').join(vars[v]); return s; }
function plural(n,key){
  const ru={appt:['запись','записи','записей'],client:['клиент','клиента','клиентов'],visit:['визит','визита','визитов']};
  const en={appt:['appointment','appointments'],client:['client','clients'],visit:['visit','visits']};
  if(state.settings.lang==='en') return n+' '+(n===1?en[key][0]:en[key][1]);
  const a=Math.abs(n)%100,b=a%10; const f=ru[key];
  return n+' '+(a>10&&a<20?f[2]:b>1&&b<5?f[1]:b===1?f[0]:f[2]);
}
function money(n){
  n=Math.round((n||0)*100)/100; const frac = Math.round(n*100)%100!==0;
  return new Intl.NumberFormat(L(),{style:'currency',currency:'USD',minimumFractionDigits:frac?2:0,maximumFractionDigits:frac?2:0}).format(n);
}
function moneyShort(n){
  if(Math.abs(n)<1000) return money(n);
  return new Intl.NumberFormat(L(),{style:'currency',currency:'USD',notation:'compact',maximumFractionDigits:1}).format(n);
}
const cap = s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;

const fmtMonthYear = s=>cap(fmt(s,{month:'long',year:'numeric'}).replace(/\s?г\.$/,''));
const fmtDayLong = s=>cap(fmt(s,{weekday:'long',day:'numeric',month:'long'}));

function durLabel(m){ m=+m||0; const h=Math.floor(m/60), mm=m%60; return (h?h+' '+t('h'):'')+(h&&mm?' ':'')+(mm||!h?mm+' '+t('min'):''); }
function initials(n){ const p=cleanName(n).split(' ').filter(Boolean); return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase(); }

function nextFreeTime(date){
  const list=apptsOn(date).filter(isActive);
  let m=toMin(state.settings.dayStart||'10:00');
  if(date===today()){ const n=new Date(); const now=Math.ceil((n.getHours()*60+n.getMinutes())/15)*15; if(now>m) m=now; }
  for(const a of list){ if(toMin(a.time)<m+(+state.settings.defDur||60) && apptEnd(a)>m) m=apptEnd(a); }
  if(m>23*60) m=toMin(state.settings.dayStart||'10:00');
  return fromMin(Math.ceil(m/15)*15);
}

/* range-based finance */
function sumRange(from,to,{onlyPast=true}={}){
  const td=today();
  let services=0,tips=0,other=0,exp=0,planned=0,count=0,cx=0,minutes=0;
  const clients=new Set();
  for(const a of state.appts){
    if(a.date<from||a.date>to) continue;
    if(!isActive(a)){ cx++; continue; }
    if(onlyPast && a.date>td){ planned+=(+a.price||0)+(+a.tip||0); continue; }
    services+=+a.price||0; tips+=+a.tip||0; count++; minutes+=+a.dur||0; clients.add(a.clientId);
  }
  for(const e of state.expenses) if(e.date>=from&&e.date<=to) exp+=+e.amount||0;
  for(const i of state.incomes) if(i.date>=from&&i.date<=to) other+=+i.amount||0;
  const income=services+tips+other;
  return {services,tips,other,income,exp,profit:income-exp,planned,count,cx,minutes,clients};
}

/* ---------- export / files ---------- */
function downloadFile(name,mime,text){
  const blob=new Blob([text],{type:mime}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function shareFile(name,mime,text){
  try{
    const file=new File([text],name,{type:mime});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file]}); return true;
    }
  }catch(e){ if(e&&e.name==='AbortError') return false; console.warn(e); }
  downloadFile(name,mime,text); return true;
}

/* ---------- iPhone Calendar (.ics) ---------- */
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){
  const enc=new TextEncoder(); if(enc.encode(line).length<=74) return line;
  const out=[]; let cur='', len=0;
  for(const ch of line){ const b=enc.encode(ch).length; if(len+b>73){ out.push(cur); cur=' '; len=1; } cur+=ch; len+=b; }
  out.push(cur); return out.join('\r\n');
}
function icsStamp(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z'; }
function icsLocal(date,min){ const d=pdate(date); d.setMinutes(min); return dstr(d).replace(/-/g,'')+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'; }
function buildIcs(list){
  const L2=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//My Customers//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const stamp=icsStamp(new Date());
  for(const a of list){
    const c=clientById(a.clientId)||{}; const st=toMin(a.time);
    const desc=[(a.services||[]).join(', '), a.price?t('price')+': '+money(a.price):'', a.prepaid?t('prepaid')+': '+money(a.prepaid):'', c.phone?t('phone')+': '+c.phone:'', a.note||''].filter(Boolean).join('\n');
    L2.push('BEGIN:VEVENT','UID:'+a.id+'@my-customers','DTSTAMP:'+stamp,'DTSTART:'+icsLocal(a.date,st),'DTEND:'+icsLocal(a.date,st+(+a.dur||60)),
      'SUMMARY:'+icsEsc((c.name||t('untitled'))+((a.services||[]).length?' — '+a.services.join(', '):'')),'DESCRIPTION:'+icsEsc(desc));
    if(c.phone) L2.push('URL:tel:'+String(c.phone).replace(/[^\d+]/g,''));
    if(+state.settings.calAlarm>0) L2.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(c.name||'Reminder'),'TRIGGER:-PT'+(+state.settings.calAlarm)+'M','END:VALARM');
    L2.push('END:VEVENT');
  }
  L2.push('END:VCALENDAR');
  return L2.map(icsFold).join('\r\n')+'\r\n';
}
function sendToCalendar(list,name){
  if(!list.length){ toast(t('cal_none_upcoming')); return; }
  const text=buildIcs(list); const fname=(name||'appointment')+'.ics'; const mode=state.settings.calMode;
  if(mode==='share') return shareFile(fname,'text/calendar',text);
  if(mode==='download') return downloadFile(fname,'text/calendar',text);
  const url=URL.createObjectURL(new Blob([text],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

/* Day strip: one continuous, smoothly scrollable row of days (about ±1 year around the anchor). */
const STRIP_SPAN=371;
const dayDiff=(a,b)=>Math.round((pdate(a)-pdate(b))/864e5);
function stripRange(){
  const n=2*STRIP_SPAN+7;
  const fromOf=anchor=>weekStart(addDays(anchor,-STRIP_SPAN));
  // Re-centre only when the selected day changed and is outside the rendered range.
  if(!ui.stripAnchor || (ui.stripSelSeen!==ui.sel && (dayDiff(ui.sel,fromOf(ui.stripAnchor))<7 || dayDiff(ui.sel,fromOf(ui.stripAnchor))>n-8))){
    ui.stripAnchor=ui.sel; ui.stripPos=null;
  }
  ui.stripSelSeen=ui.sel;
  return {from:fromOf(ui.stripAnchor), n};
}
function weekStrip(){
  const {from,n}=stripRange(), td=today();
  const cnt={}; for(const a of state.appts) if(isActive(a)) cnt[a.date]=(cnt[a.date]||0)+1;
  const off=new Set(state.daysOff);
  const wd=[]; { const d=pdate(from); for(let i=0;i<7;i++){ wd[d.getDay()]=esc(fmt(dstr(d),{weekday:'short'}).replace('.','')); d.setDate(d.getDate()+1); } }
  let cells=''; const dt=pdate(from);
  for(let i=0;i<n;i++){
    const d=dstr(dt), k=cnt[d]||0, day=dt.getDate();
    cells+=`<button class="day${d===ui.sel?' sel':''}${d===td?' today':''}${off.has(d)?' off':''}${day===1?' mstart':''}" data-act="pick" data-d="${d}"><span class="dw">${wd[dt.getDay()]}</span><span class="dn">${day}</span><span class="dots">${'<i></i>'.repeat(Math.min(k,3))}</span></button>`;
    dt.setDate(dt.getDate()+1);
  }
  return `<div class="week"><button class="nav" data-act="stripNav" data-n="-7" aria-label="prev">${I.left}</button><div class="days" id="strip">${cells}</div><button class="nav" data-act="stripNav" data-n="7" aria-label="next">${I.right}</button></div>`;
}
function bindStrip(){
  const el=document.getElementById('strip'); if(!el) return;
  const {from,n}=stripRange();
  const cw=()=>el.clientWidth/7||1;
  const smooth=ui.stripSmooth; ui.stripSmooth=false;
  const selIdx=dayDiff(ui.sel,from);
  let pos=ui.stripPos;
  if(pos==null) pos=dayDiff(weekStart(ui.sel),from);
  el.scrollLeft=Math.round(pos)*cw();
  // If the selected day is not on screen, bring its week into view.
  if(selIdx<Math.round(pos)||selIdx>Math.round(pos)+6){
    const target=dayDiff(weekStart(ui.sel),from)*cw();
    if(smooth&&!matchMedia('(prefers-reduced-motion: reduce)').matches) el.scrollTo({left:target,behavior:'smooth'}); else el.scrollLeft=target;
  }
  const title=document.getElementById('mTitle');
  let raf=0, idle=0;
  const update=()=>{
    raf=0; ui.stripPos=el.scrollLeft/cw();
    ui.visibleDate=addDays(from,Math.min(n-1,Math.max(0,Math.round(ui.stripPos)+3)));
    if(title) title.textContent=fmtMonthYear(ui.visibleDate);
  };
  update();
  el.addEventListener('scroll',()=>{
    if(!raf) raf=requestAnimationFrame(update);
    clearTimeout(idle);
    idle=setTimeout(()=>{ // near the edge of the rendered range: re-centre quietly, keeping the same days on screen
      const p=Math.round(el.scrollLeft/cw());
      if(p<28||p>n-35){
        const first=addDays(from,p);
        ui.stripAnchor=addDays(first,3); ui.stripSelSeen=ui.sel;
        const nf=weekStart(addDays(ui.stripAnchor,-STRIP_SPAN));
        ui.stripPos=dayDiff(first,nf);
        render();
      }
    },250);
  },{passive:true});
}
function monthGrid(){
  const ma=ui.monthAnchor, ms=monthStart(ma), me=monthEnd(ma), gs=weekStart(ms), td=today();
  let html=`<div class="month"><div class="mh"><button data-act="shiftMonth" data-n="-1">${I.left}</button><b>${esc(fmtMonthYear(ma))}</b><button data-act="shiftMonth" data-n="1">${I.right}</button></div><div class="mgrid">`;
  for(let i=0;i<7;i++) html+=`<div class="wd">${esc(fmt(addDays(gs,i),{weekday:'short'}).replace('.',''))}</div>`;
  let d=gs;
  while(true){
    const list=apptsOn(d).filter(isActive);
    const names=list.map(a=>cleanName(clientName(a)).split(' ')[0]);
    html+=`<button class="mc ${d<ms||d>me?'other':''} ${d===td?'today':''} ${d===ui.sel?'sel':''} ${isOff(d)?'off':''}" data-act="pickMonth" data-d="${d}">
      <span class="n">${pdate(d).getDate()}</span>${list.length?`<span class="c has">${list.length===1?esc(names[0]):list.length}</span>`:''}</button>`;
    d=addDays(d,1);
    if(d>me && (pdate(d).getDay()===1)) break;

  if(p==='week'){ const f=weekStart(anchor); return {from:f,to:addDays(f,6),label:fmtDay(f)+' – '+fmtDayY(addDays(f,6))}; }
  if(p==='year'){ const y=anchor.slice(0,4); return {from:y+'-01-01',to:y+'-12-31',label:y}; }
  if(p==='all'){ return {from:'0000-01-01',to:'9999-12-31',label:t('all_time')}; }
  return {from:monthStart(anchor),to:monthEnd(anchor),label:fmtMonthYear(anchor)};
}

  }
  if(!ss.count&&!sv.length) body+=`<div class="empty">${t('no_data')}</div>`;
  return {head, body, after:bindChart};
}
function monthChart(anchor){
  const months=[]; for(let i=11;i>=0;i--) months.push(addMonths(monthStart(anchor),-i));
  const td=today();
  const vals=months.map(m=>{const r=sumRange(monthStart(m),monthEnd(m),{onlyPast:false});return r.income;});
  const goal=+state.settings.goal||0;
  const max=Math.max(...vals,goal,1);
  const W=340,H=150,top=12,bot=20,ch=H-top-bot,bw=(W/12),gap=4;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('last12'))}">`;
  svg+=`<line class="grid" x1="0" x2="${W}" y1="${top+ch}" y2="${top+ch}"/>`;
  if(goal){ const y=top+ch-goal/max*ch; svg+=`<line class="goal" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`; }
  months.forEach((m,i)=>{
    const v=vals[i], h=v>0?Math.max(3,v/max*ch):0, x=i*bw+gap/2, y=top+ch-h, w=bw-gap, r=Math.min(4,w/2,h);
    const cur=m===monthStart(anchor);
    if(h>0) svg+=`<path class="bar ${cur?'cur':''}" d="M${x},${top+ch} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${top+ch} Z"/>`;
    svg+=`<text class="axis" x="${x+w/2}" y="${H-5}" text-anchor="middle" ${cur?'style="fill:var(--text);font-weight:600"':''}>${esc(fmt(m,{month:'narrow'}))}</text>`;
    svg+=`<rect class="hit" x="${i*bw}" y="0" width="${bw}" height="${H}" data-i="${i}" data-v="${v}" data-m="${esc(fmtMonthYear(m))}"/>`;
  });
  svg+='</svg>';
  const ci=11;
  return `<div class="chart" id="mchart">${svg}<div class="tip" id="mtip" style="left:${(ci+.5)/12*100}%;display:none"></div></div>
    <div class="kv small muted" style="margin-top:4px"><span id="mlabel">${esc(fmtMonthYear(anchor))}</span><span id="mval" class="num" style="color:var(--text)">${money(vals[ci])}</span></div>`;
}
function bindChart(){
  const c=document.getElementById('mchart'); if(!c) return;
  const bars=c.querySelectorAll('.bar');
  const show=el=>{ if(!el) return; $('#mlabel').textContent=el.dataset.m; $('#mval').textContent=money(+el.dataset.v);
    const tip=$('#mtip'); tip.style.display='block'; tip.style.left=((+el.dataset.i+.5)/12*100)+'%'; tip.textContent=moneyShort(+el.dataset.v); };
  c.querySelectorAll('.hit').forEach(h=>{ h.addEventListener('pointerenter',()=>show(h)); h.addEventListener('click',()=>show(h)); });
  c.addEventListener('pointerleave',()=>{ $('#mtip').style.display='none'; });
}

const sheetStack=[];
function openSheet(def){ sheetStack.push(def); drawSheets(true); }
function closeSheet(){ const d=sheetStack.pop(); if(d&&d.onClose) d.onClose(); drawSheets(false); render(); }
function closeAllSheets(){ while(sheetStack.length) sheetStack.pop(); drawSheets(false); render(); }
function drawSheets(anim){
  const root=$('#sheets');
  if(!sheetStack.length){ root.innerHTML=''; document.body.style.overflow=''; return; }
  document.body.style.overflow='hidden';
  const top=sheetStack[sheetStack.length-1];
  root.innerHTML=`<div class="backdrop ${anim?'':'show'}" data-act="sheetBack"></div>
    <div class="sheet ${anim?'':'show'}" role="dialog" aria-modal="true">
      <div class="sh"><button data-act="sheetCancel">${top.left||t('cancel')}</button><b>${esc(top.title)}</b><button class="r" data-act="sheetOk">${top.right||''}</button></div>
      <div class="sb" id="sb">${top.body()}</div></div>`;
  if(anim) requestAnimationFrame(()=>requestAnimationFrame(()=>{root.querySelector('.backdrop')?.classList.add('show');root.querySelector('.sheet')?.classList.add('show');}));
  if(top.mount) top.mount($('#sb'));
}
function redrawSheet(){ drawSheets(false); }

/* ----- appointment form ----- */
function apptSheet(existing, pre={}){
  const isNew=!existing;
  const f=existing?JSON.parse(JSON.stringify(existing)):{
    id:null,date:pre.date||ui.sel,time:null,dur:+state.settings.defDur||60,clientId:pre.clientId||null,
    services:pre.services?[...pre.services]:[],price:pre.price||0,prepaid:0,tip:0,note:'',status:'ok'};
  if(!f.time) f.time=nextFreeTime(f.date);
  const c0=f.clientId?clientById(f.clientId):null;
  const fs={name:c0?c0.name:'',phone:c0?c0.phone:'',priceTouched:!isNew||!!pre.price,durTouched:!isNew,svcText:'',cal:!!state.settings.calOnSave};
  if(isNew&&pre.services&&!pre.price) autoPrice();

  function autoPrice(){
    if(!fs.priceTouched){ f.price=f.services.reduce((s,n)=>s+(+(findService(n)||{}).price||0),0); }
    if(!fs.durTouched){ const d=f.services.reduce((s,n)=>s+(+(findService(n)||{}).dur||0),0); if(d) f.dur=d; }
  }
  const durOpts=()=>{const set=new Set([15,30,45,60,75,90,105,120,135,150,180,210,240,300,360,+f.dur]);return [...set].sort((a,b)=>a-b).map(n=>`<option value="${n}" ${+f.dur===n?'selected':''}>${durLabel(n)}</option>`).join('');};
  function clientSugs(){
    const q=normName(fs.name); const exact=findClientByName(fs.name);
    if(exact&&q) return '';
    let list=state.clients.map(c=>({c,last:state.appts.filter(a=>a.clientId===c.id).reduce((m,a)=>a.date>m?a.date:m,'')}));
    if(q) list=list.filter(x=>normName(x.c.name).includes(q));
    list.sort((a,b)=>b.last.localeCompare(a.last)); list=list.slice(0,8);
    return list.map(x=>`<button class="chip sug" data-pickclient="${x.c.id}"><span>${esc(x.c.name)}</span></button>`).join('');
  }
  function svcSugs(){
    const q=normName(fs.svcText); const chosen=new Set(f.services.map(normName));
    let list=state.services.filter(s=>!chosen.has(normName(s.name)));
    if(q) list=list.filter(s=>normName(s.name).includes(q));
    list.sort((a,b)=>(b.count||0)-(a.count||0)); list=list.slice(0,12);
    return list.map(s=>`<button class="chip sug" data-picksvc="${esc(s.name)}"><span>${esc(s.name)}</span>${s.price?`<small>${money(s.price)}</small>`:''}</button>`).join('');
  }
  function chips(){ return f.services.map((n,i)=>`<button class="chip sel" data-rmsvc="${i}"><span>${esc(n)}</span><span class="x">×</span></button>`).join(''); }
  const isNewClient=()=>!!cleanName(fs.name)&&!findClientByName(fs.name);

  openSheet({
    title:isNew?t('appt_new'):t('appt_edit'), right:t('save'),
    body:()=>{
      const exact=findClientByName(fs.name);
      return `
      <div class="form">
        <div class="field col"><label>${t('client')}</label><input id="fName" value="${esc(fs.name)}" placeholder="${esc(t('client_ph'))}" autocomplete="off" autocapitalize="words" enterkeyhint="next"></div>
        <div class="chipsbox" style="padding-top:0"><div class="sugs" id="cSugs">${clientSugs()}</div></div>
        <div class="field" id="phoneRow" style="${exact&&exact.phone?'display:none':''}"><label>${t('phone')}</label><input id="fPhone" type="tel" value="${esc(fs.phone)}" placeholder="${t('phone_ph')}" autocomplete="off"></div>
      </div>
      <div class="form">
        <div class="field col"><label>${t('services')}</label><input id="fSvc" value="${esc(fs.svcText)}" placeholder="${esc(t('service_ph'))}" autocomplete="off" enterkeyhint="done"></div>
        <div class="chipsbox"><div class="chips" id="sChips" style="${f.services.length?'margin-bottom:8px':''}">${chips()}</div><div class="sugs" id="sSugs">${svcSugs()}</div></div>
      </div>
      <div class="form">
        <div class="field"><label>${t('date')}</label><input id="fDate" type="date" value="${f.date}"></div>
        <div class="field"><label>${t('time')}</label><input id="fTime" type="time" value="${f.time}" step="300"></div>
        <div class="field"><label>${t('duration')}</label><select id="fDur">${durOpts()}</select></div>
      </div>
      <div class="form">
        <div class="field"><label>${t('price')}</label><input id="fPrice" inputmode="decimal" value="${f.price||''}" placeholder="$0"></div>
        <div class="field"><label>${t('prepaid')}</label><input id="fPre" inputmode="decimal" value="${f.prepaid||''}" placeholder="$0"></div>
        <div class="field"><label>${t('tip')}</label><input id="fTip" inputmode="decimal" value="${f.tip||''}" placeholder="$0"></div>
      </div>
      <div class="form"><div class="field col"><label>${t('note')}</label><textarea id="fNote" rows="2" placeholder="${t('note_ph')}">${esc(f.note)}</textarea></div></div>
      ${!isNew?`<div class="form"><div class="status">${['ok','cancelled','noshow'].map(k=>`<button class="chip ${f.status===k?'sel':''}" data-status="${k}">${t('st_'+k)}</button>`).join('')}</div></div>`:''}
      <div class="form"><div class="field"><label style="width:auto;flex:1">${t('to_calendar_on_save')}</label><span class="toggle"><input type="checkbox" id="fCal" ${fs.cal?'checked':''}><i></i></span></div></div>
      ${!isNew?`<div class="btnrow">
          <button class="btn" data-act="apRemind">${I.bell}${t('remind')}</button>
          <button class="btn" data-act="apCal">${I.calAdd}${t('to_calendar')}</button>
          <button class="btn" data-act="apRebook">${I.repeat}${t('rebook')}</button>
          <button class="btn" data-act="apClient">${I.users}${t('client')}</button>
        </div>
        <button class="btn danger" data-act="apDelete">${t('del')}</button>`:''}`;
    },
    mount:(el)=>{
      const g=id=>el.querySelector('#'+id);
      const nm=g('fName');
      if(isNew&&!fs.name) setTimeout(()=>nm.focus(),350);
      nm.addEventListener('input',()=>{ fs.name=nm.value; g('cSugs').innerHTML=clientSugs(); const ex=findClientByName(fs.name); g('phoneRow').style.display=ex&&ex.phone?'none':''; if(ex&&!fs.phoneTouched) { fs.phone=ex.phone||''; g('fPhone').value=fs.phone; } });
      g('fPhone').addEventListener('input',e=>{fs.phone=e.target.value;fs.phoneTouched=true;});
      el.querySelector('#cSugs').addEventListener('click',e=>{const b=e.target.closest('[data-pickclient]'); if(!b) return; const c=clientById(b.dataset.pickclient); fs.name=c.name; fs.phone=c.phone||''; nm.value=c.name; g('cSugs').innerHTML=''; g('phoneRow').style.display=c.phone?'none':''; g('fPhone').value=fs.phone; g('fSvc').focus(); });
      const sv=g('fSvc');
      const refreshSvc=()=>{ g('sChips').innerHTML=chips(); g('sChips').style.marginBottom=f.services.length?'8px':''; g('sSugs').innerHTML=svcSugs(); g('fPrice').value=f.price||''; g('fDur').innerHTML=durOpts(); };
      const addSvc=name=>{ name=cleanName(name); if(!name) return; const ex=findService(name); name=ex?ex.name:name; if(!f.services.some(x=>normName(x)===normName(name))) f.services.push(name); fs.svcText=''; sv.value=''; autoPrice(); refreshSvc(); };
      fs.addPending=()=>{ if(cleanName(sv.value)) addSvc(sv.value); };
      sv.addEventListener('input',()=>{ fs.svcText=sv.value; if(/[,;]$/.test(sv.value)){ addSvc(sv.value.slice(0,-1)); return; } g('sSugs').innerHTML=svcSugs(); });
      sv.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addSvc(sv.value); } });
      sv.addEventListener('blur',()=>{ setTimeout(()=>{ if(document.activeElement!==sv && cleanName(sv.value) && sheetStack.length) addSvc(sv.value); },200); });
      el.querySelector('#sSugs').addEventListener('click',e=>{const b=e.target.closest('[data-picksvc]'); if(b) addSvc(b.dataset.picksvc);});
      el.querySelector('#sChips').addEventListener('click',e=>{const b=e.target.closest('[data-rmsvc]'); if(!b) return; f.services.splice(+b.dataset.rmsvc,1); autoPrice(); refreshSvc();});
      g('fDate').addEventListener('change',e=>{ if(e.target.value) f.date=e.target.value; });
      g('fTime').addEventListener('change',e=>{ if(e.target.value) f.time=e.target.value; });
      g('fDur').addEventListener('change',e=>{ f.dur=+e.target.value; fs.durTouched=true; });
      g('fPrice').addEventListener('input',e=>{ f.price=num(e.target.value); fs.priceTouched=true; });
      g('fPre').addEventListener('input',e=>{ f.prepaid=num(e.target.value); });
      g('fTip').addEventListener('input',e=>{ f.tip=num(e.target.value); });
      g('fNote').addEventListener('input',e=>{ f.note=e.target.value; });
      g('fCal').addEventListener('change',e=>{ fs.cal=e.target.checked; state.settings.calOnSave=fs.cal; save(); });
      el.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>{ f.status=b.dataset.status; el.querySelectorAll('[data-status]').forEach(x=>x.classList.toggle('sel',x===b)); }));
    },
    ok:async()=>{
      fs.addPending&&fs.addPending();
      if(!cleanName(fs.name)){ toast(t('need_client')); $('#fName')?.focus(); return; }
      // overlap check
      const others=apptsOn(f.date).filter(a=>a.id!==f.id&&isActive(a));
      const st=toMin(f.time), en=st+(+f.dur||0);
      const clash=f.status==='ok'?others.find(a=>toMin(a.time)<en&&apptEnd(a)>st):null;
      if(clash&&!await ask(t('overlap_q',{name:clientName(clash),time:clash.time}),{ok:t('save')})) return;
      const c=getOrCreateClient(fs.name);
      if(cleanName(fs.phone)&&fs.phone!==c.phone) c.phone=cleanName(fs.phone);
      f.clientId=c.id;
      const single=f.services.length===1;
      f.services.forEach(n=>{
        let s=findService(n);
        if(!s){ s={id:uid(),name:cleanName(n),price:single?(+f.price||0):0,dur:single?(+f.dur||0):0,count:0}; state.services.push(s); }
        if(isNew||!(existing.services||[]).some(x=>normName(x)===normName(n))) s.count=(s.count||0)+1;
      });
      if(isNew){ f.id=uid(); f.created=new Date().toISOString(); state.appts.push(f); }
      else { const i=state.appts.findIndex(a=>a.id===f.id); state.appts[i]=f; }
      save(); ui.sel=f.date; if(ui.monthOpen) ui.monthAnchor=f.date;
      if(fs.cal&&isActive(f)) sendToCalendar([f],'appointment-'+f.date);
      closeSheet(); toast(t('saved'));
    },
    acts:{
      apDelete:async()=>{ if(!await ask(t('del_appt_q'),{ok:t('del'),danger:true})) return; state.appts=state.appts.filter(a=>a.id!==f.id); save(); closeSheet(); toast(t('deleted')); },
      apCal:()=>sendToCalendar([f],'appointment-'+f.date),
      apRemind:()=>remindSheet(f),
      apRebook:()=>{ closeSheet(); apptSheet(null,{clientId:f.clientId,services:f.services,date:addDays(f.date,21)}); },
      apClient:()=>{ if(f.clientId) clientSheet(f.clientId); },
    }
  });
}

/* ----- client card ----- */
function clientSheet(id){
  const c=clientById(id); if(!c) return;
  openSheet({title:c.name, left:t('close'),
    body:()=>{
      const cc=clientById(id); if(!cc) return '';
      const s=clientStats(id); const td=today();
      const up=s.list.filter(a=>a.date>=td).sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
      const hist=s.list.filter(a=>a.date<td);
      const years={}; hist.forEach(a=>{(years[a.date.slice(0,4)]=years[a.date.slice(0,4)]||[]).push(a);});
      return `<div style="display:flex;flex-direction:column;align-items:center;padding:14px 0 4px">
          <div class="avatar" style="width:68px;height:68px;font-size:24px">${esc(initials(cc.name))}</div></div>
        <div class="btnrow">
          <button class="btn" data-act="cCall" ${cc.phone?'':'disabled style="opacity:.4"'}>${I.phone}${t('call')}</button>
          <button class="btn" data-act="cSms" ${cc.phone?'':'disabled style="opacity:.4"'}>${I.msg}${t('sms')}</button>
          <button class="btn" data-act="cWa" ${cc.phone?'':'disabled style="opacity:.4"'}>${I.wa}WhatsApp</button>
          <button class="btn" data-act="cInsta" ${cc.insta?'':'disabled style="opacity:.4"'}>${I.insta}Instagram</button>
        </div>
        <div class="form">
          <div class="field"><label>${t('name')}</label><input id="cName" value="${esc(cc.name)}" autocomplete="off" autocapitalize="words"></div>
          <div class="field"><label>${t('phone')}</label><input id="cPhone" type="tel" value="${esc(cc.phone||'')}" placeholder="+1 …" autocomplete="off"></div>
          <div class="field"><label>${t('instagram')}</label><input id="cInsta" value="${esc(cc.insta||'')}" placeholder="${t('insta_ph')}" autocomplete="off" autocapitalize="off"></div>
          <div class="field col"><label>${t('note')}</label><textarea id="cNote" rows="2" placeholder="${t('note_ph')}">${esc(cc.note||'')}</textarea></div>
        </div>
        <div class="tiles">
          <div class="tile"><div class="l">${t('visits')}</div><div class="v">${s.visits}</div></div>
          <div class="tile"><div class="l">${t('spent')}</div><div class="v">${money(s.total)}</div></div>
          <div class="tile"><div class="l">${t('avg_check')}</div><div class="v">${money(s.avg)}</div></div>
          <div class="tile"><div class="l">${t('last_visit')}</div><div class="v" style="font-size:17px;padding-top:3px">${s.last?esc(fmtDayY(s.last)):t('never')}</div></div>
        </div>
        <button class="btn primary" data-act="cNew">${I.plus}${t('new_appt_for')}</button>
        ${up.length?`<div class="sec-title">${t('upcoming')}</div><div class="list">${up.map(a=>apptRow(a,{showDate:true})).join('')}</div>`:''}
        ${Object.keys(years).sort().reverse().map(y=>`<div class="sec-title">${t('history')} · ${y}</div><div class="list">${years[y].map(a=>apptRow(a,{showDate:true,past:true})).join('')}</div>`).join('')}
        <button class="btn danger" data-act="cDelete" style="margin-top:22px">${t('del')}</button>`;
    },
    mount:el=>{
      const cc=clientById(id); if(!cc) return;
      const g=x=>el.querySelector('#'+x);
      g('cName').addEventListener('change',async e=>{
        const v=cleanName(e.target.value); if(!v){ e.target.value=cc.name; return; }
        const other=state.clients.find(x=>x.id!==id&&normName(x.name)===normName(v));
        if(other){
          if(await ask(t('merge_q',{name:other.name}),{ok:'OK'})){
            state.appts.forEach(a=>{ if(a.clientId===id) a.clientId=other.id; });
            other.phone=other.phone||cc.phone; other.insta=other.insta||cc.insta; other.note=[other.note,cc.note].filter(Boolean).join('\n');
            state.clients=state.clients.filter(x=>x.id!==id); save(); sheetStack.pop(); toast(t('merged')); clientSheet(other.id); return;
          } else { e.target.value=cc.name; return; }
        }
        cc.name=v; save(); sheetStack[sheetStack.length-1].title=v; redrawSheet();
      });
      g('cPhone').addEventListener('change',e=>{ cc.phone=cleanName(e.target.value); save(); redrawSheet(); });
      g('cInsta').addEventListener('change',e=>{ cc.insta=cleanName(e.target.value); save(); redrawSheet(); });
      g('cNote').addEventListener('change',e=>{ cc.note=e.target.value; save(); });
    },
    acts:{
      cCall:()=>{ const cc=clientById(id); if(cc.phone) openUrl('tel:'+phoneDigits(cc.phone)); },
      cSms:()=>{ const cc=clientById(id); if(cc.phone) openUrl('sms:'+phoneDigits(cc.phone)); },
      cWa:()=>{ const cc=clientById(id); if(cc.phone) openUrl(waLink(cc.phone,'')); },
      cInsta:()=>{ const cc=clientById(id); if(cc.insta) openUrl(instaLink(cc.insta)); },
      cNew:()=>{ const last=clientAppts(id)[0]; apptSheet(null,{clientId:id,services:last?last.services:[],date:ui.sel>=today()?ui.sel:today()}); },
      cDelete:async()=>{
        const n=state.appts.filter(a=>a.clientId===id).length;
        if(!await ask(n?t('del_client_appts_q',{n}):t('del_client_q'),{ok:t('del'),danger:true})) return;
        state.appts=state.appts.filter(a=>a.clientId!==id); state.clients=state.clients.filter(x=>x.id!==id); save(); closeSheet(); toast(t('deleted'));
      },
    }});
}

/* ----- expense / other income ----- */
function moneySheet(kind,existing){
  const isExp=kind==='exp'; const coll=isExp?'expenses':'incomes'; const tagKey=isExp?'cat':'src';
  const f=existing?{...existing}:{id:null,date:today(),amount:0,[tagKey]:'',note:''};
  const tags=()=>{ const m={}; state[coll].forEach(x=>{const k=cleanName(x[tagKey]); if(k) m[k]=(m[k]||0)+1;}); const q=normName(f[tagKey]);
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).filter(k=>!q||(normName(k).includes(q)&&normName(k)!==q)).slice(0,10)
      .map(k=>`<button class="chip sug" data-tag="${esc(k)}"><span>${esc(k)}</span></button>`).join(''); };
  openSheet({title:existing?(isExp?t('expense'):t('inc')):(isExp?t('add_expense'):t('add_income')), right:t('save'),
    body:()=>`<div class="form">
      <div class="field"><label>${t('amount')}</label><input id="mAmt" inputmode="decimal" value="${f.amount||''}" placeholder="$0"></div>
      <div class="field"><label>${t('date')}</label><input id="mDate" type="date" value="${f.date}"></div></div>
      <div class="form"><div class="field col"><label>${isExp?t('category'):t('source')}</label><input id="mTag" value="${esc(f[tagKey])}" placeholder="${esc(isExp?t('category_ph'):t('source_ph'))}" autocomplete="off"></div>
      <div class="chipsbox" style="padding-top:0"><div class="sugs" id="mTags">${tags()}</div></div></div>
      <div class="form"><div class="field col"><label>${t('note')}</label><textarea id="mNote" rows="2" placeholder="${t('note_ph')}">${esc(f.note)}</textarea></div></div>
      ${existing?`<button class="btn danger" data-act="mDel">${t('del')}</button>`:''}`,
    mount:el=>{
      const g=x=>el.querySelector('#'+x);
      g('mAmt').addEventListener('input',e=>f.amount=num(e.target.value));
      g('mDate').addEventListener('change',e=>{ if(e.target.value) f.date=e.target.value; });
      g('mTag').addEventListener('input',e=>{ f[tagKey]=e.target.value; g('mTags').innerHTML=tags(); });
      g('mTags').addEventListener('click',e=>{ const b=e.target.closest('[data-tag]'); if(!b) return; f[tagKey]=b.dataset.tag; g('mTag').value=f[tagKey]; g('mTags').innerHTML=tags(); });
      g('mNote').addEventListener('input',e=>f.note=e.target.value);
      if(!existing) setTimeout(()=>g('mAmt').focus(),350);
    },
    ok:()=>{
      if(!(f.amount>0)){ toast(t('need_amount')); return; }
      f[tagKey]=cleanName(f[tagKey]);
      if(existing){ const i=state[coll].findIndex(x=>x.id===f.id); state[coll][i]=f; } else { f.id=uid(); state[coll].push(f); }
      save(); closeSheet(); toast(t('saved'));
    },
    acts:{ mDel:async()=>{ if(!await ask(t('del_q'),{ok:t('del'),danger:true})) return; state[coll]=state[coll].filter(x=>x.id!==f.id); save(); closeSheet(); toast(t('deleted')); } }
  });
}

      <div class="field"><label>${t('name')}</label><input id="vName" value="${esc(f.name)}" autocomplete="off"></div>
      <div class="field"><label>${t('price')}</label><input id="vPrice" inputmode="decimal" value="${f.price||''}" placeholder="$0"></div>
      <div class="field"><label>${t('duration')}</label><select id="vDur">${durOpts}</select></div></div>
      ${existing?`<button class="btn danger" data-act="vDel">${t('del')}</button>`:''}`,
    mount:el=>{ el.querySelector('#vName').addEventListener('input',e=>f.name=e.target.value); el.querySelector('#vPrice').addEventListener('input',e=>f.price=num(e.target.value)); el.querySelector('#vDur').addEventListener('change',e=>f.dur=+e.target.value); },
    ok:()=>{
      f.name=cleanName(f.name); if(!f.name) return;
      const dup=state.services.find(s=>s.id!==f.id&&normName(s.name)===normName(f.name)); if(dup){ toast('⚠️ '+dup.name); return; }
      if(existing){ const i=state.services.findIndex(s=>s.id===f.id); state.services[i]=f; } else { f.id=uid(); state.services.push(f); }
      save(); closeSheet();
    },
    acts:{ vDel:async()=>{ if(!await ask(t('del_service_q'),{ok:t('del'),danger:true})) return; state.services=state.services.filter(s=>s.id!==f.id); save(); closeSheet(); } }
  });
}
function goalSheet(){
  let v=state.settings.goal||0;
  openSheet({title:t('goal'), right:t('save'),
    body:()=>`<div class="form"><div class="field"><label>${t('amount')}</label><input id="gAmt" inputmode="decimal" value="${v||''}" placeholder="$0"></div></div>`,
    mount:el=>{ const i=el.querySelector('#gAmt'); i.addEventListener('input',e=>v=num(e.target.value)); setTimeout(()=>i.focus(),350); },
    ok:()=>{ state.settings.goal=v; save(); closeSheet(); }});
}
function welcomeSheet(){
  openSheet({title:t('welcome_t'), left:' ', right:t('start'),
    body:()=>`<div style="text-align:center;padding:24px 8px 8px"><img src="icon-192.png" alt="" width="84" height="84" style="border-radius:20px"></div>
      <p style="font-size:17px;line-height:1.45;text-align:center;margin:8px 6px 18px">${t('welcome')}</p>
      <div class="seg">${['ru','en'].map(k=>`<button class="${state.settings.lang===k?'on':''}" data-act="set" data-k="lang" data-v="${k}">${k==='ru'?'Русский':'English'}</button>`).join('')}</div>
      ${isIOS()&&!isStandalone()?`<div class="banner" style="margin-top:14px"><div class="grow"><b>${t('install_t')}</b>${t('install')}</div></div>`:''}`,
    ok:()=>{ state.settings.welcomed=true; save(); closeSheet(); },
    onClose:()=>{ state.settings.welcomed=true; save(); }
  });
}

/* =========================================================================
   ACTIONS (event delegation)
   ========================================================================= */
const ACT={
  tab:el=>{ ui.tab=el.dataset.k; window.scrollTo(0,0); render(); },
  pick:el=>{ ui.sel=el.dataset.d; render(); },
  pickMonth:el=>{ ui.sel=el.dataset.d; ui.monthAnchor=el.dataset.d; ui.monthOpen=false; render(); },
  stripNav:el=>{ const st=document.getElementById('strip'); if(st) st.scrollBy({left:(+el.dataset.n)*st.clientWidth/7,behavior:'smooth'}); },
  shiftMonth:el=>{ ui.monthAnchor=addMonths(monthStart(ui.monthAnchor),+el.dataset.n); render(); },
  toggleMonth:()=>{ ui.monthOpen=!ui.monthOpen; ui.monthAnchor=ui.monthOpen?(ui.visibleDate||ui.sel):ui.sel; render(); },
  goToday:()=>{ ui.sel=today(); ui.monthAnchor=ui.sel; ui.stripSmooth=true; render(); },
  toggleOff:()=>{ const d=ui.sel; state.daysOff=isOff(d)?state.daysOff.filter(x=>x!==d):[...state.daysOff,d]; save(); render(); },
  newAppt:()=>apptSheet(null,{date:ui.sel}),
  editAppt:el=>{ const a=state.appts.find(x=>x.id===el.dataset.id); if(a) apptSheet(a); },
  newClient:()=>newClientSheet(),
  openClient:el=>clientSheet(el.dataset.id),
  finPeriod:el=>{ ui.finPeriod=el.dataset.k; render(); },
  finShift:el=>{ const n=+el.dataset.n, p=ui.finPeriod; ui.finAnchor=p==='week'?addDays(ui.finAnchor,7*n):p==='year'?addMonths(ui.finAnchor,12*n):addMonths(ui.finAnchor,n); render(); },
  newExpense:()=>moneySheet('exp'), newIncome:()=>moneySheet('inc'),
  editExpense:el=>moneySheet('exp',state.expenses.find(x=>x.id===el.dataset.id)),
  editIncome:el=>moneySheet('inc',state.incomes.find(x=>x.id===el.dataset.id)),
  statShift:el=>{ ui.statAnchor=addMonths(ui.statAnchor,+el.dataset.n); render(); },
  statMode:el=>{ ui.statSoFar=el.dataset.v==='1'; render(); },
  setGoal:()=>goalSheet(),
  set:el=>{ const k=el.dataset.k; state.settings[k]=el.dataset.v; save(); render(); if(sheetStack.length) redrawSheet(); },
  services:()=>servicesSheet(),
  backup:()=>backup(), restore:()=>restore(), csvAppts:()=>exportApptsCsv(), csvFin:()=>exportFinCsv(),
  calTest:()=>{ const d=today(); const fake={id:'test-'+uid(),date:d,time:fromMin(Math.min(23*60,Math.ceil((nowMin()+60)/15)*15)),dur:30,clientId:null,services:['My Customers test'],price:0}; sendToCalendar([fake],'test'); },
  calUpcoming:()=>{ const td=today(); sendToCalendar(state.appts.filter(a=>a.date>=td&&isActive(a)),'upcoming-appointments'); },
  wipe:async()=>{ if(!await ask(t('wipe_q'),{ok:t('del'),danger:true})||!await ask(t('wipe_q2'),{ok:t('del'),danger:true})) return; const keep=state.settings; state=defaults(); state.settings=Object.assign(state.settings,{lang:keep.lang,theme:keep.theme,accent:keep.accent,welcomed:true}); writeState(); render(); toast(t('deleted')); },
  hideNag:()=>{ ui.nagHidden=true; render(); },
  hideInstall:()=>{ ui.installHidden=true; render(); },
  sheetBack:()=>closeSheet(),
  sheetCancel:()=>closeSheet(),
  sheetOk:()=>{ const top=sheetStack[sheetStack.length-1]; if(top&&top.ok) top.ok(); },
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled) return;
  const a=el.dataset.act;
  const top=sheetStack[sheetStack.length-1];
  if(el.closest('.sheet')&&top&&top.acts&&top.acts[a]){ e.preventDefault(); top.acts[a](el); return; }
  if(ACT[a]){ e.preventDefault(); ACT[a](el,e); }
});

/* =========================================================================
   START
   ========================================================================= */
(async function start(){
  state=normalize(await loadState());
  const td=today(); ui.sel=td; ui.monthAnchor=td; ui.finAnchor=td; ui.statAnchor=td;
  render();
  if(!state.settings.welcomed&&!state.appts.length) welcomeSheet();
  try{ if(navigator.storage&&navigator.storage.persist){ persisted=await navigator.storage.persisted()||await navigator.storage.persist(); } }catch(e){}
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e));
  }
  // refresh "today" when the app comes back after midnight
  let lastDay=td;
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&today()!==lastDay){ if(ui.sel===lastDay) ui.sel=today(); lastDay=today(); if(!sheetStack.length) render(); } });
})();
</script>
</body>
